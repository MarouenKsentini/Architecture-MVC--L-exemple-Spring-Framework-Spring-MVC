<!-- VIEW — template : se contente d'afficher l'état du ViewModel et de lui déléguer les actions -->
<section class="card">
  <h2>Liste des produits</h2>

  <form class="form" (ngSubmit)="add()">
    <input name="libelle" [(ngModel)]="libelle" placeholder="Libellé" required />
    <input name="prix" type="number" step="0.01" [(ngModel)]="prix" placeholder="Prix" />
    <input name="qteStock" type="number" [(ngModel)]="qteStock" placeholder="Quantité" />
    <button type="submit">Ajouter</button>
  </form>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Libellé</th>
        <th>Prix</th>
        <th>Quantité en Stock</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (product of products(); track product.id) {
        <tr>
          <td>{{ product.id }}</td>
          <td>{{ product.libelle }}</td>
          <td>{{ product.prix | currency: 'EUR' }}</td>
          <td>{{ product.qteStock }}</td>
          <td>
            <button type="button" class="danger" (click)="remove(product.id)">
              Supprimer
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="empty">Aucun produit</td>
        </tr>
      }
    </tbody>
  </table>

  <p class="total">
    Valeur totale du stock : <strong>{{ total() | currency: 'EUR' }}</strong>
  </p>
</section>
